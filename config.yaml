# Cinven Screener configuration. Every target criterion lives here so the bar moves without
# code changes. Dates are ISO; money is GBP unless the key says otherwise. Calibration figures
# come from docs/research (the measured entry profile) and are revised there first.

build:
  as_of_date: "2026-11-09"
  country: "GB"
  snapshot_basic: "BasicCompanyDataAsOneFile-2026-11-01.zip"
  snapshot_psc_file: "persons-with-significant-control-snapshot-2026-11-09.zip"
  snapshot_psc_date: "2026-11-09"
  snapshot_psc_parts: 33
  accounts_monthly:
    - November2025
    - December2025
    - January2026
    - February2026
    - March2026
    - April2026
    - May2026
    - June2026
    - July2026
    - August2026
    - September2026
    - October2026
  accounts_daily_from: "2026-11-01"   # day after the last monthly archive; dailies only fill the gap

paths:
  raw: data/raw
  cache: data/cache
  parquet: data/parquet
  duckdb: data/screener.duckdb
  docs: docs

target:
  status: "Active"
  # Candidates for the accounts filter: Active companies whose last accounts were filed in a
  # large-company category. Small, micro, dormant and abridged filers cannot be at Cinven's scale.
  candidate_account_categories: ["FULL", "GROUP", "MEDIUM"]
  incorporated_on_or_before: "2021-11-01"     # five years of filings
  exclude_account_categories: ["MICRO ENTITY", "DORMANT", "NO ACCOUNTS FILED", "SMALL", "TOTAL EXEMPTION SMALL", "UNAUDITED ABRIDGED", "FILLETED"]
  # SIC codes that never describe an operating business a buyout fund would buy on its own:
  # banks, insurers' regulated carriers, pension funds, trusts, public administration, SPVs.
  # Holding-company codes (64209, 70100) are kept because PE-owned groups file group accounts
  # under a Topco with exactly those codes.
  exclude_sic: ["64110", "64191", "64192", "64205", "64301", "64302", "64303", "64304", "64305", "64306", "65110", "65120", "65201", "65202", "65300", "84110", "84120", "84130", "84210", "84220", "84230", "84240", "84250", "84300", "94110", "94120", "94200", "94910", "94920", "94990", "97000", "98000", "98100", "98200", "99000", "99999"]
  sectors: ["business_services", "consumer", "financial_services", "healthcare", "industrials", "tmt"]
  force_include: []    # back-test companies carried as comparables; filled from docs/research/03 once it lands
  # Size band, provisional until the measured entry profile (docs/research/02) lands. Cinven's
  # flagship fund writes equity cheques of roughly EUR 200M to 1B into companies with EV of
  # roughly EUR 500M to 5B; at 8x to 14x EBITDA that is EBITDA of ~GBP 30M to 350M and turnover
  # of ~GBP 150M upwards. Universe floor is set lower so smaller platforms stay as comparables.
  universe_turnover_min_gbp: 50000000
  universe_employees_min: 150
  universe_employees_max: 500000
  rank_turnover_min_gbp: 150000000
  ebitda_target_min_gbp: 30000000
  ebitda_target_max_gbp: 400000000
  ebitda_early_floor_gbp: 15000000

# Theme maps: every company in the universe whose site uses a theme's vocabulary, founder-owned or
# not, so a sourcing team that works by end market can see all the players at once. Keyword scan on
# the fetched site text, no model call; the matching sentence is shown as the evidence. Themes chosen
# to match Brighton Park's published portfolio (Canary: hospitality; HITRUST: GRC) and the London
# team's stated sourcing interests.
themes:
  min_distinct: 3
  min_total: 5
  list:
    property_management:
      label: "Property management"
      keywords: [property management, lettings, letting agent, landlord, tenant, tenancy, block management, estate agent, residential property, commercial property, housing association, social housing, facilities management, rent collection, property portfolio, leasehold, service charge, building safety, real estate software, proptech, deposit protection, right to rent, inventory inspection, maintenance requests]
    contractor_compliance:
      label: "Contractor compliance and payroll"
      keywords: [contractor, ir35, umbrella company, umbrella payroll, construction industry scheme, right to work, worker compliance, agency worker, temporary workers, timesheet, timesheets, payroll, payroll software, workforce compliance, pay and bill, recruitment agency software, back office for recruitment, supplier compliance, subcontractor, off-payroll, employment status, auto-enrolment, hmrc recognised]
    tax_accounting:
      label: "Tax and accounting software"
      keywords: [tax software, making tax digital, corporation tax, vat return, vat returns, self assessment, tax return, tax returns, accounting software, accountancy practice, practice management for accountants, bookkeeping, bookkeeping software, year-end accounts, ixbrl, hmrc, tax compliance, r&d tax, capital allowances, tax relief, payroll year end, cloud accounting, audit software, trust accounting]
    hospitality:
      label: "Hospitality software"
      keywords: [hotel, hotels, hospitality, guest experience, property management system, channel manager, booking engine, restaurant, epos, table management, hotel management, guest messaging, contactless check-in, front desk, housekeeping, revenue management for hotels, holiday park, pub, bar management]

ownership:
  # Stage 3 rules, applied in order. See docs/methodology.md.
  statement_kinds:
    - "no-individual-or-entity-with-signficant-control"   # register typo is real
    - "no-individual-or-entity-with-significant-control"
    - "psc-exists-but-not-identified"
    - "steps-to-find-psc-not-yet-completed"
  high_confidence_band: "ownership-of-shares-75-to-100-percent"
  band_midpoints:
    "ownership-of-shares-25-to-50-percent": 37.5
    "ownership-of-shares-50-to-75-percent": 62.5
    "ownership-of-shares-75-to-100-percent": 87.5
    "ownership-of-shares-more-than-25-percent-registered-overseas-entity": 37.5
  combined_high_pct: 75
  combined_medium_pct: 50
  max_individual_pscs: 3
  director_within_months_of_incorporation: 12
  holdco_walkup_levels: 3
  sh01_investor_threshold: 3
