<title>BPC AI Screener (Beta)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a dark-blue left rail of views on desktop, a top strip on phones; content on white in a 1320px column.
   Brand: Brighton Park's own system (Merriweather serif headings at regular weight, DM Sans body, dark blue #012130,
   blue #105063, green #44d2b8, orange #fd623b, grey #c5d3dd, light #f4f9ff), applied through tokens so both themes hold.
   Register conventions kept: company numbers, SIC codes, filing types and financial years as filed. */
:root{
  --bg:#ffffff; --panel:#ffffff; --fg:#012130; --muted:#5d6c7b; --line:#dce6ee; --soft:#f4f9ff;
  --accent:#105063; --accent-ink:#ffffff; --warn:#fd623b; --good:#2bb89a; --grey:#9fb0bd; --bar:#e4ecf3;
  --rail:#012130; --rail-fg:#ffffff; --rail-muted:#9fb6c3; --rail-active:#44d2b8; --green:#44d2b8;
  --display:"Merriweather",Georgia,"Times New Roman",serif; --body:"DM Sans","Helvetica Neue",Arial,sans-serif; --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0a1a24; --panel:#0f2330; --fg:#eef4f7; --muted:#9fb6c3; --line:#1f3642; --soft:#132b38; --accent:#44d2b8; --accent-ink:#012130; --warn:#ff8a66; --good:#44d2b8; --grey:#6f8694; --bar:#1f3642; --rail:#061520; --rail-fg:#ffffff; --rail-muted:#9fb6c3; --rail-active:#44d2b8; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#0a1a24; --panel:#0f2330; --fg:#eef4f7; --muted:#9fb6c3; --line:#1f3642; --soft:#132b38; --accent:#44d2b8; --accent-ink:#012130; --warn:#ff8a66; --good:#44d2b8; --grey:#6f8694; --bar:#1f3642; --rail:#061520; --rail-fg:#ffffff; --rail-muted:#9fb6c3; --rail-active:#44d2b8; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:-0.005em;text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:2rem} h2{font-size:1.4rem;margin-block:1.8rem .6rem} h3{font-size:1.05rem;margin-block:1rem .4rem;font-weight:700}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100%}
nav.rail{background:var(--rail);color:var(--rail-fg);padding:1.3rem 1rem;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:.25rem}
nav.rail .brand{font-family:var(--display);font-size:1.1rem;font-weight:400;margin-bottom:1.2rem;line-height:1.3;color:var(--rail-fg)}
nav.rail .brand .beta{display:inline-block;margin-left:.35rem;font-family:var(--body);font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--rail-active);border:1px solid var(--rail-active);border-radius:999px;padding:.05rem .45rem;vertical-align:middle}
nav.rail a{display:block;padding:.5rem .7rem;border-radius:999px;color:var(--rail-fg);text-decoration:none;font-weight:500}
nav.rail a:hover{background:rgba(255,255,255,.08)}
nav.rail a.active{background:var(--rail-active);color:var(--rail)}
nav.rail .foot{margin-top:auto;font-size:.78rem;color:var(--rail-muted);line-height:1.45}
main{padding-block:1.6rem 3rem;padding-inline:clamp(16px,3vw,40px);max-width:1360px;min-width:0}
main.wide{max-width:none}
table.fit{table-layout:fixed;width:100%} table.fit td{overflow-wrap:anywhere;white-space:normal} table.fit th{white-space:normal}
.sub{display:block;font-size:.78rem;color:var(--muted);font-weight:400}
@media (max-width:1100px){ table.fit{table-layout:auto;min-width:1100px} }
.eyebrow{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--green);font-weight:700}
.lead{color:var(--muted);max-width:70ch;font-size:1rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.8rem;margin-block:1rem}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:.9rem 1rem;min-width:0}
.tile .k{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.tile .v{font-family:var(--display);font-size:1.75rem;font-weight:400;line-height:1.15;margin-top:.25rem}
.tile .s{font-size:.8rem;color:var(--muted);margin-top:.25rem}
.filters{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:end;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:.9rem 1rem;margin-block:.8rem}
.filters label{display:flex;flex-direction:column;gap:.2rem;font-size:.76rem;color:var(--muted);font-weight:600}
.filters input,.filters select{font:inherit;font-size:.9rem;font-weight:400;padding:.4rem .55rem;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);min-width:0}
.filters input[type=checkbox],.filters input[type=range]{width:auto;accent-color:var(--accent)}
.filters .chk{flex-direction:row;align-items:center;gap:.4rem;padding-bottom:.35rem;font-weight:500}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:.5rem .65rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--soft);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap;cursor:pointer;font-weight:700}
th.sorted::after{content:" \25BE";color:var(--accent)} th.sorted.asc::after{content:" \25B4"}
tr.row{cursor:pointer} tr.row:hover td{background:var(--soft)}
td.r,th.r{text-align:right}
.bar{position:relative;height:9px;background:var(--bar);border-radius:999px;min-width:40px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:999px}
.bar.grey i{background:var(--grey)} .bar.green i{background:var(--green)}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:.12rem .55rem;border-radius:999px;border:1px solid var(--line);background:var(--soft);white-space:nowrap}
.pill.core{border-color:var(--good);color:var(--good)} .pill.early{border-color:var(--warn);color:var(--warn)} .pill.below,.pill.toosmall{color:var(--muted)}
.pill.upper{border-color:var(--accent);color:var(--accent)}
.vert{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;margin-right:.3rem;vertical-align:-1px}
.v-compliance_grc{background:#105063} .v-fintech_financial{background:#fd623b} .v-healthcare{background:#44d2b8} .v-other{background:#9fb0bd}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:1.2rem;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem;min-width:0}
.card h3{margin-top:0}
.card.dark{background:var(--rail);color:var(--rail-fg);border-color:var(--rail)} .card.dark h3,.card.dark .small,.card.dark .eyebrow{color:var(--rail-fg)} .card.dark .small{opacity:.85} .card.dark a{color:var(--green)}
.quote{border-left:3px solid var(--green);padding:.3rem .9rem;margin:.6rem 0;color:var(--muted);font-style:italic;font-family:var(--display);font-size:.95rem}
.quote a{font-style:normal;font-size:.85rem;font-family:var(--body)}
.why{display:flex;flex-direction:column;gap:.55rem}
.why .sig{display:grid;grid-template-columns:1.4rem minmax(0,1fr);gap:.4rem}
.why .dot{width:.8rem;height:.8rem;border-radius:50%;margin-top:.35rem}
.dot.approach{background:var(--good)} .dot.caution{background:var(--warn)} .dot.context{background:var(--grey)}
.why .lbl{font-weight:600} .why .det{font-size:.88rem;color:var(--muted)}
details{border:1px solid var(--line);border-radius:10px;padding:.45rem .8rem;margin:.3rem 0;background:var(--soft)}
summary{cursor:pointer;font-weight:600;font-size:.9rem}
.rub{display:grid;grid-template-columns:minmax(0,1fr) 120px 2rem;gap:.5rem;align-items:center;font-size:.88rem;margin:.25rem 0}
.rub .bar{height:11px}
.rub .bar.high i{background:var(--good)} .rub .bar.medium i{background:var(--warn)} .rub .bar.low i{background:var(--grey)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:.2rem .8rem;font-size:.9rem}
.kv .k{color:var(--muted)}
.small{font-size:.84rem;color:var(--muted)}
.note{background:var(--soft);border-radius:12px;padding:.7rem .9rem;font-size:.9rem;border:1px solid var(--line)}
svg text{fill:var(--fg);font-family:var(--mono);font-size:11px}
.back{display:inline-block;margin-bottom:.8rem;font-size:.9rem;font-weight:600}
.stack{display:flex;flex-direction:column;gap:1.2rem}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:1rem}
.btn{font:inherit;font-size:.85rem;font-weight:600;padding:.45rem .95rem;border:1px solid var(--fg);border-radius:999px;background:var(--panel);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.on{background:var(--green);color:var(--rail);border-color:var(--green)}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.hint{font-size:.8rem;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-block:.6rem}
.weights{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:.4rem 1.2rem;font-size:.84rem}
.weights label{display:grid;grid-template-columns:minmax(0,1fr) 90px 3rem;gap:.5rem;align-items:center;font-weight:500;color:var(--fg)}
.weights input[type=range]{width:90px;margin:0}
textarea.brief{width:100%;min-height:220px;font:inherit;font-size:.9rem;padding:.7rem .8rem;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);resize:vertical}
.memo{max-width:76ch}
.memo p{margin:.5rem 0}
.star{cursor:pointer;color:var(--grey);font-size:1.1rem;line-height:1;user-select:none} .star.on{color:var(--warn)}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;padding:.8rem 16px;gap:.25rem}
  nav.rail .brand{width:100%;margin-bottom:.4rem} nav.rail .foot{display:none}
  nav.rail a{padding:.35rem .7rem;font-size:.9rem}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
</style>

<div class="app">
  <nav class="rail" id="nav">
    <div class="brand">BPC AI Screener<span class="beta">Beta</span></div>
    <a href="#ranked" data-view="ranked">Ranked</a>
    <a href="#funnel" data-view="funnel">Funnel</a>
    <a href="#themes" data-view="themes">Themes</a>
    <a href="#methods" data-view="methods">Methods</a>
    <a href="#calibration" data-view="calibration">Calibration</a>
    <a href="#shortlist" data-view="shortlist">Shortlist</a>
    <a href="#lookup" data-view="lookup">Look up a company</a>
    <div class="foot" id="foot"></div>
  </nav>
  <main id="main"></main>
</div>

<script id="screener-data" type="application/json">__DATA__</script>
<script>
(function(){
const D = JSON.parse(document.getElementById('screener-data').textContent);
const VERT = {compliance_grc:'Compliance & GRC', fintech_financial:'Fintech & financial', healthcare:'Healthcare', other:'Other'};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const title = s => String(s||'').toLowerCase().replace(/(^|\s|\(|-|')([a-z])/g, (m,p,c)=>p+c.toUpperCase());
const gbp = v => v==null ? 'n/a' : (Math.abs(v)>=1e6 ? '£'+(v/1e6).toFixed(1)+'M' : Math.abs(v)>=1e3 ? '£'+(v/1e3).toFixed(0)+'k' : '£'+Math.round(v));
const num = (v,d=0) => v==null||isNaN(v) ? 'n/a' : Number(v).toLocaleString('en-GB',{maximumFractionDigits:d});
const date = v => v ? String(v).slice(0,10) : '';
const pct = v => v==null ? 'n/a' : Math.round(v*100)+'%';
const bar = (v,max,cls='') => `<div class="bar ${cls}" title="${v==null?'n/a':num(v,1)}"><i style="width:${v==null?0:Math.max(0,Math.min(100,100*v/max))}%"></i></div>`;
const pill = v => { const k=(v||'unknown').replace(' ',''); return `<span class="pill ${esc(k)}">${esc(v||'unknown')}</span>`; };
const vdot = v => `<span class="vert v-${esc(v||'other')}"></span>${esc(VERT[v]||v||'')}`;
const fitLabel = {fit_all:'Measured, US + UK portfolio', fit_uk:'Measured, UK portfolio only', size_fit:'Cheque-size inference (p50 revenue)'};
const main = $('#main');
$('#foot').textContent = 'Built ' + (D.built_at||'').slice(0,16).replace('T',' ') + ' UTC. Companies House data under the Open Government Licence.';

// ------------------------------------------------------------ per-viewer state: custom weights, shortlist, notes
const DEFAULT_W = Object.fromEntries(Object.entries(D.config.rubric.weights).map(([k,v])=>[Number(k), v]));
const DIMS = Object.keys(D.config.rubric.dimension_names).map(Number);
const store = { get(k, d){ try { const v = localStorage.getItem('bpc-'+k); return v==null ? d : JSON.parse(v); } catch(e){ return d; } }, set(k, v){ try { localStorage.setItem('bpc-'+k, JSON.stringify(v)); } catch(e){} } };
let weights = Object.assign({}, DEFAULT_W, store.get('weights', {}));
let shortlist = new Set(store.get('shortlist', []));
let notes = store.get('notes', {});
// Investability components and their maximum points (they sum to 100 at the default weights).
const IMAX = {size: D.config.investability.size_points, growth: D.config.investability.growth_points, hiring: D.config.investability.hiring_points, leverage: D.config.investability.leverage_points, data_quality: D.config.investability.data_quality_points};
const ILABEL = {size: 'Size', growth: 'Growth', hiring: 'Hiring', leverage: 'Financial leverage', data_quality: 'Data reliability'};
const IKEYS = Object.keys(IMAX);
let iweights = Object.assign({}, IMAX, store.get('iweights', {}));
let rankBy = store.get('rankBy', 'durability');
const durCustom = () => DIMS.some(k => Math.abs((weights[k]||0) - DEFAULT_W[k]) > 1e-9);
const invCustom = () => IKEYS.some(k => Math.abs((iweights[k]||0) - IMAX[k]) > 1e-9);
const weightsCustom = () => durCustom() || invCustom() || rankBy !== 'durability';
function investabilityFor(r){
  if (!r.investability_components_json) return r.investability_base ?? null;
  let comp; try { comp = JSON.parse(r.investability_components_json); } catch(e){ return r.investability_base ?? null; }
  const wsum = IKEYS.reduce((a,k)=>a+(iweights[k]||0), 0); if (!wsum) return null;
  const v = IKEYS.reduce((a,k)=>a+(iweights[k]||0)*((comp[k]||0)/IMAX[k]), 0) / wsum;
  return Math.round(v*1000)/10;
}
function durabilityFor(n){
  const c = D.companies[n]; if (!c) return null;
  const sc = c.scores.filter(x => x.score != null);
  if (!sc.length) return null;
  const wsum = sc.reduce((a,x)=>a+(weights[x.dimension]||0), 0); if (!wsum) return null;
  const wm = sc.reduce((a,x)=>a+(weights[x.dimension]||0)*x.score, 0) / wsum;
  return Math.round((wm-1)/4*1000)/10;
}
function applyWeights(){
  for (const r of D.rankings){
    r.durability_score = durCustom() ? durabilityFor(r.company_number) : r.durability_base;
    r.investability_score = invCustom() ? investabilityFor(r) : r.investability_base;
  }
  const byDur = (a,b)=>(b.durability_score??-1)-(a.durability_score??-1) || (b.investability_score??-1)-(a.investability_score??-1);
  const byInv = (a,b)=>(b.investability_score??-1)-(a.investability_score??-1) || (b.durability_score??-1)-(a.durability_score??-1);
  const ranked = D.rankings.filter(r=>r.ranked).sort(rankBy==='investability' ? byInv : byDur);
  ranked.forEach((r,i)=>{ r.rank = i+1; });
}
for (const r of D.rankings){ r.durability_base = r.durability_score; r.investability_base = r.investability_score; r.rank_base = r.rank; }
if (weightsCustom()) applyWeights();
function toggleStar(n){ shortlist.has(n) ? shortlist.delete(n) : shortlist.add(n); store.set('shortlist', [...shortlist]); }
async function copyText(text, btn){
  try { await navigator.clipboard.writeText(text); if (btn){ const t=btn.textContent; btn.textContent='Copied'; setTimeout(()=>btn.textContent=t, 1500); } }
  catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(_){ } document.body.removeChild(ta); if (btn){ btn.textContent='Copied'; } }
}

// ------------------------------------------------------------ routing
function route(){
  const h = (location.hash||'#ranked').slice(1);
  main.classList.toggle('wide', h==='ranked' || h.startsWith('theme'));
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', h.startsWith(a.dataset.view)));
  if (h.startsWith('c-')) return company(h.slice(2));
  if (h.startsWith('brief-')) return brief(h.slice(6));
  if (h.startsWith('theme-')) return themes(h.slice(6));
  ({ranked, funnel, themes, methods, calibration, shortlist: shortlistView, lookup}[h] || ranked)();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);

// ------------------------------------------------------------ ranked
const state = {q:'', verts:new Set(Object.keys(VERT).filter(v=>v!=='other')), gate:'all', cal:'fit_all', fits:'all', minStaff:0, minDur:0, comparables:false, small:false, sort:'rank', asc:true};
try { Object.assign(state, JSON.parse(localStorage.getItem('screener-ranked')||'{}'), {verts:new Set(JSON.parse(localStorage.getItem('screener-verts')||'null')||[...state.verts])}); } catch(e){}
function saveState(){ try { localStorage.setItem('screener-ranked', JSON.stringify({...state, verts:undefined})); localStorage.setItem('screener-verts', JSON.stringify([...state.verts])); } catch(e){} }

function ranked(){
  const rs = D.docs.rankings_summary||{}, bp=(D.docs.bp_pattern||{}).cohorts||{};
  const nRanked = D.rankings.filter(r=>r.ranked).length, nLed = D.rankings.filter(r=>r.founder_led).length;
  const inband = D.rankings.filter(r=>r.ranked && ['core','early','upper'].includes(r[state.cal])).length;
  const band = (bp[state.cal.replace('fit_','')]||{}).headcount_band||{};
  main.innerHTML = `
    <div class="eyebrow">Ranked shortlist</div>
    <h1>Founder-led UK software companies at the size Brighton Park enters at</h1>
    <p class="lead">Compliance, fintech and healthcare software companies found on Companies House filings, scored on an AI-durability rubric adapted from Mark Dzialga (February 2026). Durability sorts the list; investability breaks ties; they are never blended. Click a row for the evidence.</p>
    <div class="tiles">
      <div class="tile"><div class="k">Ranked</div><div class="v num">${nRanked}</div><div class="s">founder-led, 80+ staff, size verified</div></div>
      <div class="tile"><div class="k">In the fund's measured band</div><div class="v num">${inband}</div><div class="s">${band.min?`entries ${band.min} to ${band.max} staff, core ${band.core_lo} to ${band.core_hi}`:''}</div></div>
      <div class="tile"><div class="k">Founder-led in the three verticals</div><div class="v num">${nLed}</div><div class="s">any size; ${D.rankings.filter(r=>r.founder_led && !r.ranked).length} unranked (small, unverified or reviewer-excluded)</div></div>
      <div class="tile"><div class="k">Comparables</div><div class="v num">${D.rankings.length-nRanked}</div><div class="s">same verticals, failed a gate</div></div>
    </div>
    <div class="filters">
      <label>Search<input id="f-q" value="${esc(state.q)}" placeholder="name, town, sub-vertical"></label>
      <label>Vertical<span>${Object.keys(VERT).filter(v=>v!=='other').map(v=>`<label class="chk" style="display:inline-flex;margin-right:.5rem"><input type="checkbox" data-vert="${v}" ${state.verts.has(v)?'checked':''}>${VERT[v]}</label>`).join('')}</span></label>
      <label>Gate<select id="f-gate"><option value="all">all</option><option value="founder-owned">founder-owned</option><option value="founder-led, prior capital">founder-led, prior capital</option></select></label>
      <label>Size calibration<select id="f-cal">${Object.entries(fitLabel).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>
      <label>Fit<select id="f-fit"><option value="all">all</option><option value="inband">core, early or upper</option><option value="core">core only</option></select></label>
      <label>Min staff<input id="f-staff" type="number" min="0" step="10" value="${state.minStaff}" style="width:5.5rem"></label>
      <label>Min durability<input id="f-dur" type="number" min="0" max="100" step="5" value="${state.minDur}" style="width:5.5rem"></label>
      <label class="chk"><input id="f-comp" type="checkbox" ${state.comparables?'checked':''}>Include comparables</label>
      <label class="chk"><input id="f-small" type="checkbox" ${state.small?'checked':''}>Include founder-led under 80 staff</label>
    </div>
    <details id="w-panel" ${weightsCustom()?'open':''}><summary>Custom assessment: re-weight either score and the list re-ranks live${weightsCustom()?' (custom settings in use)':''}</summary>
      <div class="toolbar" style="margin-top:.6rem"><label class="small" style="display:flex;gap:.5rem;align-items:center;font-weight:600">Rank by
        <select id="w-rankby" style="font:inherit;font-size:.88rem;padding:.3rem .5rem;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg)">
          <option value="durability" ${rankBy==='durability'?'selected':''}>AI durability, investability breaks ties (default)</option>
          <option value="investability" ${rankBy==='investability'?'selected':''}>Investability, AI durability breaks ties</option>

      <div class="weights">${DIMS.map(k=>`<label><span>${k}. ${esc(D.config.rubric.dimension_names[k])}</span><input type="range" min="0" max="30" step="1" data-w="${k}" value="${Math.round((weights[k]||0)*100)}"><span class="num" id="wv-${k}">${Math.round((weights[k]||0)*100)}%</span></label>`).join('')}</div>
      <h3 style="margin-top:1rem">Investability: five components</h3>

      <div class="toolbar"><button class="btn" id="w-reset">Reset all to defaults</button><span class="hint">Both scores are recomputed in this browser as weighted means rescaled 0 to 100. Stored in this browser only.</span></div>

  $('#f-gate').value = state.gate; $('#f-cal').value = state.cal; $('#f-fit').value = state.fits;

  document.querySelectorAll('[data-vert]').forEach(cb => cb.addEventListener('change', e => { e.target.checked ? state.verts.add(e.target.dataset.vert) : state.verts.delete(e.target.dataset.vert); saveState(); drawTable(); }));

  document.querySelectorAll('[data-iw]').forEach(sl => sl.addEventListener('input', e => { const k=e.target.dataset.iw; iweights[k]=Number(e.target.value); $('#iwv-'+k).textContent=e.target.value+'%'; store.set('iweights', iweights); applyWeights(); drawTable(); }));

  $('#w-reset').addEventListener('click', () => { weights = Object.assign({}, DEFAULT_W); iweights = Object.assign({}, IMAX); rankBy = 'durability'; store.set('weights', {}); store.set('iweights', {}); store.set('rankBy', 'durability'); applyWeights(); ranked(); });
  drawTable();
}

function drawTable(){
  let rows = D.rankings.filter(r => r.ranked || (state.comparables) || (state.small && r.founder_led && (r.latest_employees||0) < 80));
  rows = rows.filter(r => state.verts.has(r.vertical));
  if (state.gate!=='all') rows = rows.filter(r => r.gate===state.gate);
  if (state.fits==='inband') rows = rows.filter(r => ['core','early','upper'].includes(r[state.cal]));
  if (state.fits==='core') rows = rows.filter(r => r[state.cal]==='core');
  if (state.minStaff) rows = rows.filter(r => (r.latest_employees||0) >= state.minStaff);
  if (state.minDur) rows = rows.filter(r => (r.durability_score||0) >= state.minDur);
  if (state.q) rows = rows.filter(r => [r.name, r.post_town, r.sub_vertical, r.company_number].join(' ').toLowerCase().includes(state.q));
  const key = state.sort, dir = state.asc?1:-1;
  rows.sort((a,b) => { const x=a[key], y=b[key]; if (x==null && y==null) return 0; if (x==null) return 1; if (y==null) return -1; return (x<y?-1:x>y?1:0)*dir; });
  const nR = D.rankings.filter(r=>r.ranked).length;
  $('#r-caption').textContent = `${rows.length} companies shown of ${nR} ranked and ${D.rankings.length-nR} comparables. Calibration: ${fitLabel[state.cal]}.`;
  const cols = [['star','',2],['rank','#',3],['name','Company',14],['vertical','Vertical',12],['latest_employees','Staff',5],['revenue_display','Revenue',12],[state.cal,'Fit',6],['durability_score','Durability',8],['investability_score','Invest&shy;ability',8],['gate','Gate',8],['why_now_approach','Why now',6],['evidence_quote','Evidence',18]];
  const GATE = {'founder-owned':'owned', 'founder-led, prior capital':'led, prior capital', 'not founder-led':'not led'};
  $('#r-table').innerHTML = `<table class="fit"><colgroup>${cols.map(c=>`<col style="width:${c[2]}%">`).join('')}</colgroup><thead><tr>${cols.map(([k,l])=>`<th data-k="${k}" class="${k===state.sort?'sorted'+(state.asc?' asc':''):''} ${['latest_employees','durability_score','investability_score','rank'].includes(k)?'r':''}">${l}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`
    <tr class="row" data-n="${r.company_number}">
      <td><span class="star ${shortlist.has(r.company_number)?'on':''}" data-star="${r.company_number}" title="Add to shortlist">${shortlist.has(r.company_number)?'\u2605':'\u2606'}</span></td>
      <td class="r num">${r.rank??''}</td>
      <td><strong>${esc(title(r.name))}</strong><span class="sub">${esc(title(r.post_town||''))} · ${esc(r.company_number)}</span></td>
      <td>${vdot(r.vertical)}<span class="sub">${esc(r.sub_vertical||'')}</span></td>
      <td class="r num">${num(r.latest_employees)}</td>
      <td class="num" title="${esc(r.revenue_display||'')}">${esc((r.revenue_display||'n/a').split(' (')[0])}<span class="sub">${esc(r.tier?('Tier '+r.tier+(r.revenue_period_end?', FY '+String(r.revenue_period_end).slice(0,7):'')):'')}</span></td>
      <td>${pill(r[state.cal])}</td>
      <td class="r"><span class="num">${num(r.durability_score)}</span>${bar(r.durability_score,100,r.grey?'grey':'')}</td>
      <td class="r"><span class="num">${num(r.investability_score)}</span>${bar(r.investability_score,100)}</td>
      <td class="small">${esc(GATE[r.gate]||r.gate||'')}<span class="sub">${esc(r.founder_confidence||r.exclusion_reason||'')}</span></td>
      <td class="num" title="green: reasons to approach; orange: things to ask about"><span style="color:var(--good)">${r.why_now_approach??0}</span> / <span style="color:var(--warn)">${r.why_now_caution??0}</span></td>
      <td class="small" title="${esc(r.evidence_quote||'')}">${esc((r.evidence_quote||'').slice(0,110))}${(r.evidence_quote||'').length>110?'…':''}</td></tr>`).join('')}</tbody></table>`;
  document.querySelectorAll('#r-table th').forEach(th => th.addEventListener('click', () => { const k=th.dataset.k; if (k==='star') return; if (state.sort===k) state.asc=!state.asc; else { state.sort=k; state.asc = !['durability_score','investability_score','latest_employees','why_now_approach'].includes(k); } saveState(); drawTable(); }));
  document.querySelectorAll('#r-table tr.row').forEach(tr => tr.addEventListener('click', () => { location.hash = 'c-'+tr.dataset.n; }));
  document.querySelectorAll('#r-table [data-star]').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); toggleStar(el.dataset.star); drawTable(); }));
  const cap = $('#r-caption'); if (weightsCustom()) cap.textContent += ' Custom settings in use (' + [durCustom()?'durability weights':'', invCustom()?'investability weights':'', rankBy!=='durability'?'ranked by investability':''].filter(Boolean).join(', ') + '); scores and rank are recomputed in this browser.';
  if (shortlist.size) cap.textContent += ` ${shortlist.size} on the shortlist.`;
}

function svgBars(points, opts){
  const w=opts.w||520, h=opts.h||170, pad={l:44,r:10,t:14,b:28};
  const max = Math.max(...points.map(p=>p.v), 1)*1.15, iw=w-pad.l-pad.r, ih=h-pad.t-pad.b, bw=Math.min(60, iw/points.length*0.6);
  const ticks=[0,0.5,1].map(f=>Math.round(max*f/ (max>100?10:1))*(max>100?10:1));
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;display:block" role="img" aria-label="${esc(opts.label)}">
    ${ticks.map(t=>`<g><line x1="${pad.l}" x2="${w-pad.r}" y1="${pad.t+ih-ih*t/max}" y2="${pad.t+ih-ih*t/max}" stroke="var(--line)"/><text x="${pad.l-6}" y="${pad.t+ih-ih*t/max+4}" text-anchor="end" fill="var(--muted)">${num(t)}</text></g>`).join('')}
    ${points.map((p,i)=>{ const x=pad.l+iw*(i+0.5)/points.length-bw/2, bh=ih*p.v/max; return `<g><rect x="${x}" y="${pad.t+ih-bh}" width="${bw}" height="${bh}" fill="var(--accent)" rx="2"/><text x="${x+bw/2}" y="${pad.t+ih-bh-4}" text-anchor="middle">${num(p.v)}</text><text x="${x+bw/2}" y="${h-8}" text-anchor="middle" fill="var(--muted)">${esc(p.l)}</text></g>`; }).join('')}
  </svg>`;
}

// ------------------------------------------------------------ similar companies (same vertical, vocabulary overlap, shared themes)
const STOP = new Set(['the','and','for','with','that','this','from','are','our','your','their','is','a','an','of','to','in','on','by','or','as','at','it','its','we','you','platform','software','solutions','solution','company','limited','ltd','uk','service','services']);
const toks = s => new Set(String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(t=>t.length>2 && !STOP.has(t)));
function similar(n, k=6){
  const me = D.rankings.find(r=>r.company_number===n); if (!me) return [];
  const mine = toks((me.sub_vertical||'')+' '+(me.sub_vertical||'')+' '+(me.evidence_quote||''));
  const myThemes = new Set(D.themes.filter(t=>t.company_number===n).map(t=>t.theme));
  return D.rankings.filter(r=>r.company_number!==n && r.vertical===me.vertical).map(r=>{
    const t = toks((r.sub_vertical||'')+' '+(r.sub_vertical||'')+' '+(r.evidence_quote||''));
    let score = 0; for (const x of mine) if (t.has(x)) score += 1;
    const th = D.themes.filter(x=>x.company_number===r.company_number && myThemes.has(x.theme)).length; score += 2*th;
    return {r, score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score || (b.r.durability_score||0)-(a.r.durability_score||0)).slice(0,k).map(x=>x.r);
}
function similarHtml(n){
  const sim = similar(n); if (!sim.length) return '';
  return `<h2>Similar companies</h2><p class="small">Same vertical, ranked by shared vocabulary in the sub-vertical and evidence quote and by shared theme maps. Ownership and size beside each, so the market map is the comparables set.</p>
    <div class="tablewrap"><table><thead><tr><th>Company</th><th>Sub-vertical</th><th class="r">Staff</th><th>Ownership</th><th>Fit</th><th class="r">Durability</th><th>Revenue</th></tr></thead><tbody>${sim.map(r=>`<tr class="row" data-n="${r.company_number}"><td><strong>${esc(title(r.name))}</strong><span class="sub">${esc(title(r.post_town||''))}</span></td><td class="small">${esc(r.sub_vertical||'')}</td><td class="r num">${num(r.latest_employees)}</td><td class="small">${esc(r.gate||'')}${r.ranked?'':' · comparable'}</td><td>${pill(r.fit_all)}</td><td class="r num">${num(r.durability_score)}</td><td class="small">${esc((r.revenue_display||'n/a').split(' (')[0])}</td></tr>`).join('')}</tbody></table></div>`;
}

// ------------------------------------------------------------ founder questions from the data gaps
function gapQuestions(c){
  const r=c.ranking, rv=c.revenue, q=[];
  if (!rv.tier || rv.tier==='C' || rv.tier==='none') q.push(`Revenue is not filed (${rv.tier==='C' ? 'the screener models ' + (rv.display||'').split(' (')[0] : 'no figure on the register'}): what was last year's revenue and ARR, and what is the split between recurring and services?`);
  if ((r.flags||[]).includes('growth_unknown') || r.headcount_cagr==null) q.push('Only one year of headcount is on file: what was headcount two and three years ago, and what is the plan for the next 12 months?');
  else if (r.headcount_cagr!=null && r.headcount_cagr < 0) q.push(`Average headcount fell (${pct(r.headcount_cagr)} a year): what drove the reduction, and has it reversed?`);
  for (const s of c.scores.filter(x=>x.score==null)) q.push(`${s.dimension_name}: nothing on the website answered this. ${({1:'How does the product sit in the customer\'s workflow: system of record, orchestration layer, or a tool on the side?',2:'How is the product architected for AI: APIs, data model, where models plug in?',3:'What are gross retention, net retention and the share of revenue that is recurring?',4:'What leading indicators do you track: pipeline, sales cycle, usage?',5:'Is the category new or an established one being defended?',6:'What would it cost a customer to leave, in time and money?',7:'Who else is consolidating this space, and have you been approached?',8:'What happens to a customer when the product fails for a day?',9:'Which certifications and audits do customers require, and which do you hold?',10:'Which regulations shape the product, and how often do they change?'})[s.dimension]||''}`);
  for (const s of c.scores.filter(x=>x.score!=null && x.confidence==='low')) q.push(`${s.dimension_name} was scored ${s.score} at low confidence: ${s.rationale||'the evidence was thin'}. What is the fuller picture?`);
  for (const w of c.why_now.filter(x=>x.direction==='caution')) q.push(`${w.label}: ${w.detail.split('.')[0]}. What was it for?`);
  if (c.charges.some(x=>!x.satisfied_on)) q.push(`There ${c.charges.filter(x=>!x.satisfied_on).length===1?'is an outstanding charge':'are outstanding charges'} on the register: what facility, what size, and what are the covenants?`);
  if (!c.jobs_summary.open_roles) q.push('No public careers page was found: how many open roles are there today, and in which functions?');
  if (r.gate==='founder-led, prior capital') q.push(`Prior capital sits on the register${(c.universe.investor_names||[]).length?' ('+c.universe.investor_names.join(', ')+')':''}: what are their rights, their time horizon, and would they sell down in a new round?`);
  if ((r.flags||[]).includes('sh01_heavy') || (r.flags||[]).includes('share_premium_high') || (r.flags||[]).includes('check_share_premium')) q.push('The allotment and share-premium history suggests outside money the PSC register does not show: who is on the cap table below 25%, and are there options outstanding?');
  if (c.universe.walkup_path) q.push(`Ownership runs through a holding company (${c.universe.walkup_path}): what sits in the holdco besides this company?`);
  return q;
}

      <tr><td class="small">Ownership gate</td>${rows.map(r=>`<td class="small">${esc(r.gate||'')}</td>`).join('')}</tr>
    </tbody></table></div>` : '<div class="note">Nothing starred yet. Use the star in the first column of the Ranked table or the button on a company page.</div>'}`;

    $('#s-briefs').addEventListener('click', e => copyText(rows.map(r => briefText(r.company_number)).join('\n\n' + '='.repeat(60) + '\n\n'), e.target));
    document.querySelectorAll('#main [data-stage]').forEach(sel => { sel.addEventListener('click', ev => ev.stopPropagation()); sel.addEventListener('change', ev => { stages[sel.dataset.stage] = ev.target.value; store.set('stages', stages); }); });

    document.querySelectorAll('#main tr.row').forEach(tr => tr.addEventListener('click', () => { location.hash = 'c-'+tr.dataset.n; }));
    document.querySelectorAll('#main [data-star]').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); toggleStar(el.dataset.star); shortlistView(); }));

}

    ${cs.rows?`<p class="small">Classification run ${esc((cs.computed_at||'').slice(0,16))}: ${num(cs.rows)} companies; model-labelled ${num(cs.llm)}, keyword pre-filter other ${num(cs.keyword_prefilter_other)}, no website ${num(cs.no_website)}; classifier_failed ${cs.classifier_failed||0}.</p>`:''}

    ${D.score_stats.length?`<div class="tablewrap"><table><thead><tr><th>#</th><th>Dimension</th><th class="r">Mean</th><th class="r">Scored</th><th class="r">Unscored</th><th class="r">High confidence</th></tr></thead><tbody>${D.score_stats.map(s=>`<tr><td class="num">${s.dimension}</td><td>${esc(s.dimension_name)}</td><td class="r num">${num(s.mean_score,2)}</td><td class="r num">${s.scored}</td><td class="r num">${s.unscored}</td><td class="r num">${s.high_conf}</td></tr>`).join('')}</tbody></table></div>`:''}

    <p class="small">Where the reviewer disagreed on the 71 (a company can fail more than one): ownership ${(pr.disagreement_reasons||{}).ownership}, website ${(pr.disagreement_reasons||{}).website}, vertical ${(pr.disagreement_reasons||{}).vertical}. Ownership misses are investors under 25% or exits the register shows late; vertical misses are services firms with a product page. Both became rules or overrides.</p>
    <div class="tablewrap"><table><thead><tr><th>Stage</th><th class="r">Companies</th><th class="r">Size verified</th><th class="r">Founder flag decided</th><th class="r">Website found</th><th class="r">Revenue filed or OCR</th><th class="r">Revenue modelled</th><th class="r">No revenue figure</th><th class="r">Rubric scored</th></tr></thead><tbody>${[['universe','Universe (size and age gate)'],['target_verticals','Target verticals (classified)'],['ranked','Ranked (founder gate)']].map(([k,l])=>{const c=comp[k]||{}; return c.companies?`<tr><td>${l}</td><td class="r num">${num(c.companies)}</td><td class="r num">${num(c.size_verified_pct)}%</td><td class="r num">${num(c.founder_flag_decided_pct)}%</td><td class="r num">${num(c.website_found_pct)}%</td><td class="r num">${num(c.revenue_filed_or_ocr_pct)}%</td><td class="r num">${num(c.revenue_modelled_pct)}%</td><td class="r num">${num(c.revenue_none_pct)}%</td><td class="r num">${num(c.rubric_scored_pct)}%</td></tr>`:''}).join('')}</tbody></table></div>`:''}

    <h2>Why now signals</h2><p class="lead">Timing is not scored. Each company page lists dated facts with the source for each: months since the last share allotment, PSC register movements and director changes in the last 12 months, owner-directors' tenure and register year of birth, charges created or satisfied in the last 18 months, headcount acceleration or contraction, an accounts category stepping up, and open senior commercial, finance or non-UK roles. They are hypotheses about the founder's position.</p>
    ${D.why_stats.length?`<div class="tablewrap"><table><thead><tr><th>Signal</th><th>Direction</th><th class="r">Rows</th><th class="r">Companies</th></tr></thead><tbody>${D.why_stats.map(s=>`<tr><td class="num">${esc(s.signal)}</td><td>${esc(s.direction)}</td><td class="r num">${s.n}</td><td class="r num">${s.companies}</td></tr>`).join('')}</tbody></table></div>`:''}

    <h2>Rubric weights</h2><p class="small"><strong>${esc(cfg.rubric.source_label)}</strong> Source: <a href="${esc(cfg.rubric.source_url)}" target="_blank" rel="noopener">${esc(cfg.rubric.source_url)}</a>. The post states that its views are qualitative and not investment criteria; the weights are a first pass.</p>
    <div class="tablewrap"><table><thead><tr><th>#</th><th>Dimension</th><th class="r">Weight</th></tr></thead><tbody>${Object.keys(names).map(k=>`<tr><td class="num">${k}</td><td>${esc(names[k])}</td><td class="r num">${Math.round(w[k]*100)}%</td></tr>`).join('')}</tbody></table></div>
    <p class="small">Durability = weighted mean of the scored dimensions rescaled to 0 to 100; two or more unscored dimensions show a grey score. Investability (0 to 100) is deterministic: founder-led is a gate; size 30 points (p50 revenue inside £${cfg.target.revenue_target_min_gbp/1e6}M to £${cfg.target.revenue_target_max_gbp/1e6}M), growth 25 (headcount CAGR, 20% scores full), hiring intensity 15, leverage 15 (no outstanding charges full, a charge in the last 18 months zero), data quality 15.</p>

    <h2>Ownership rules</h2><p class="lead">Applied in order to the PSC register; the first rule that fires decides. (1) Only a statement record (nobody over 25%): excluded as dispersed. (2) An active corporate PSC on the investor list or carrying a fund token (LP, Nominees, Trustees, Fund, Ventures, Capital Partners), or an employee ownership trust: excluded as investor present. (3) A UK corporate PSC that is not an investor: walk up the holdco chain (up to three levels). (4) One to three individuals at 75% or more with a founding director among them: founder, high. (5) 50% to 75%, or the director test fails: founder, medium. (6) Trusts, firms, super-secure records, or every individual owner resident abroad: uncertain. SH01 allotments and share premium set investor possible without excluding.</p>
    <p class="lead"><strong>Founder-led, the ranking gate since the calibration:</strong> any company where an individual PSC at 25% or more (direct or through the holdco walk) passes the founding-director test, whatever else sits on the register. Founder-owned companies qualify by definition; a VC-backed company whose founder keeps 25% and a board seat qualifies too; a company whose individual owners all live abroad does not. Ranked = founder-led, size verified, 80 staff or more, website verified where the name is a single token, and not excluded by the reviewer.</p>
    <p class="small">Known gaps: investors under 25% never appear in PSC data; EMI options are invisible until exercised; a trading subsidiary under a group topco is scored at the topco; nominee holdings hide the beneficial owner.</p>

    <h2>Back-tests</h2>${bt.results?`<div class="tablewrap"><table><thead><tr><th>Company</th><th>Number</th><th>Expected</th><th>Result</th><th>Detail</th></tr></thead><tbody>${bt.results.map(b=>`<tr><td>${esc(b.Company)}</td><td class="num">${esc(b.Number)}</td><td class="small">${esc(b.Expected)}</td><td><span class="pill ${b.Result==='pass'?'core':'early'}">${esc(b.Result)}</span></td><td class="small">${esc(b.Detail)}</td></tr>`).join('')}</tbody></table></div>`:''}
    <h2>Not used, and why</h2><p class="small">LinkedIn (no API; scraping breaches terms; manual check for the top names only). Indeed (publisher API closed). Beauhurst, PitchBook, Grata, Harmonic, Specter (paid, no self-serve trial). Streaming API, public-spend joins, Adzuna, G-Cloud and CQC checks are on the cut list.</p>`;
}

// ------------------------------------------------------------ calibration

  main.innerHTML = `<div class="eyebrow">Calibration</div><h1>Measured against the fund's own entries</h1>
    <p class="lead">The four UK back-tests check the pipeline's mechanics on known names. The target is the pattern the London office exists to replicate: Brighton Park's five-year, 31-company portfolio. Each company was profiled at entry from press releases, Companies House and headcount trackers, every figure tied to a quoted source. Revenue at entry is disclosed for four companies only, so the measured variable is entry headcount, with revenue implied through the screener's own revenue-per-head median.</p>
    <div class="note">Public profile: growth cheques of roughly $50M to $250M, mostly minority, in profitable or near-profitable software; Fund I $1.1B, Fund II $1.8B (November 2022); about 32 portfolio companies; London office opened 2025. The first build ranked founder-owned companies at 25 to 400 staff and 33 of its 38 were smaller than anything the fund had entered; the list was rebuilt to the measured pattern: universe to 800 staff, ranking gate at 80, founder-led in place of founder-owned.</div>
    <h2>Two calibrations</h2>
    <div class="tablewrap"><table><thead><tr><th></th><th>US + UK + rest of world</th><th>UK only</th></tr></thead><tbody>
      ${row('Companies', c=>`${c.n_all||0} (${c.n_private||0} private entries; band from ${c.n_headcount_known||0} software entries with a known headcount)`)}
      ${row('Entry headcount core (p25 to p75)', c=>`<span class="num">${hb(c).core_lo} to ${hb(c).core_hi}</span>`)}
      ${row('Smallest / largest software entry', c=>`<span class="num">${hb(c).min} / ${hb(c).max}</span>`)}
      ${row('Implied revenue core', c=>`<span class="num">£${num(ir(c).core_lo)}M to £${num(ir(c).core_hi)}M</span> at £${num(ir(c).rev_per_head_gbp)} per head`)}
      ${row('Round size, disclosed', c=>rt(c).n?`median $${num(rt(c).p50)}M (p25 $${num(rt(c).p25)}M, p75 $${num(rt(c).p75)}M, n=${rt(c).n})`:'n/a')}
      ${row('Founder-led at entry', c=>`${sh(c,'founder_led').yes} of ${sh(c,'founder_led').of_known} (${sh(c,'founder_led').pct_of_known}%)`)}
      ${row('Founder still CEO', c=>`${sh(c,'founder_ceo').yes} of ${sh(c,'founder_ceo').of_known}`)}
      ${row('First institutional capital', c=>`${sh(c,'first_institutional').yes} of ${sh(c,'first_institutional').of_known} (${sh(c,'first_institutional').pct_of_known}%, ${sh(c,'first_institutional').unknown} unknown)`)}
      ${row('Deal types', c=>Object.entries(c.by_deal_type||{}).map(([k,v])=>`${k} ${v}`).join(', '))}
      ${row('Verticals', c=>Object.entries(c.by_vertical||{}).map(([k,v])=>`${k} ${v}`).join(', '))}
      ${row('Revenue disclosed at entry', c=>(c.entry_revenue_disclosed||[]).map(x=>`${x.name} $${num(x.usd_m)}M ${x.basis}${x.headcount?' ('+x.headcount+' staff)':''}`).join('; ')||'none')}
      <tr><td>Ranked list against the band</td><td>${fits('fit_all_ranked')}</td><td>${fits('fit_uk_ranked')}</td></tr>
    </tbody></table></div>
    <p class="small">Caveats: the UK cohort is four private entries, so its band is four numbers; headcounts for 2021 to 2026 entries come from Revelio quarterly estimates or press releases, earlier ones are often unknown; minority versus majority is inferred from syndicate structure for about half the deals; one entry (Darktrace) was an open-market purchase of listed shares and is excluded from the bands; tech-enabled services entries (1,000 to 3,000 staff) are excluded from the software band. The 2019 to 2020 vintage had two stated majority deals.</p>
    <h2>The 31 entry profiles</h2>
    <div class="tablewrap"><table><thead><tr><th>Company</th><th>Vertical</th><th>HQ</th><th class="r">Year</th><th>Deal</th><th class="r">Round $M</th><th class="r">BP $M</th><th>First institutional</th><th>Founder-led</th><th class="r">Entry revenue $M</th><th class="r">Entry staff</th><th>Status</th><th>Source</th></tr></thead><tbody>${(bp.table||[]).map(t=>`<tr><td><strong>${esc(t.name)}</strong></td><td class="small">${esc(t.bp_vertical||'')}</td><td class="small">${esc(t.hq_country||'')}</td><td class="r num">${t.bp_invest_year||''}</td><td class="small">${esc(t.deal_type||'')}</td><td class="r num">${t.round_total_usd_m??''}</td><td class="r num">${t.bp_amount_usd_m??''}</td><td class="small">${esc(t.first_institutional_capital||'')}</td><td class="small">${esc(t.founder_led_at_entry||'')}</td><td class="r num">${t.entry_revenue_or_arr_usd_m??''}</td><td class="r num">${t.entry_headcount_est??''}</td><td class="small">${esc(t.status||'')}</td><td class="small">${(t.sources||[])[0]?`<a href="${esc(t.sources[0])}" target="_blank" rel="noopener">source</a>`:''}</td></tr>`).join('')}</tbody></table></div>`;
}
